# rol de minimo privilegio para cada microservicio
# ninguno de los 5 necesita hablarle a la api de kubernetes
# (no crean pods, no leen secrets via api, no escalan nada)
# por eso el rol se deja sin reglas, es el privilegio mas bajo posible

{{- range $service := list "auth-service" "artists-service" "appointments-service" "notification-service" "api-gateway" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-{{ $service }}-role
  namespace: {{ $.Release.Namespace }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $service }}-rolebinding
  namespace: {{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-{{ $service }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $.Release.Name }}-{{ $service }}-role
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}