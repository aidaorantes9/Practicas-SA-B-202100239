# un poddisruptionbudget por microservicio
# evita que kubernetes tumbe todos los pods de un servicio al mismo tiempo
# durante un mantenimiento planificado (por ejemplo, drenar un nodo)

{{- range $service := list "auth-service" "artists-service" "appointments-service" "notification-service" "api-gateway" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $service }}-pdb
  namespace: {{ $.Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $service }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
---
{{- end }}