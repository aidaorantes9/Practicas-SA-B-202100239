# P10 - el canary se promueve segun el comportamiento REAL de la version candidata, medido en Prometheus.
# Todas las consultas filtran por rollouts_pod_template_hash: solo cuentan los pods del canary.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "api-gateway.fullname" . }}-metricas
spec:
  args:
    - name: canary-hash
  metrics:
    # sin trafico no hay evidencia: un canary que no recibio peticiones no se promueve
    - name: trafico-canary
      initialDelay: 2m
      interval: 1m
      count: 3
      failureLimit: 1
      successCondition: result[0] >= {{ .Values.analisis.minTrafico }}
      provider:
        prometheus:
          address: {{ .Values.analisis.prometheus }}
          query: |
            sum(rate(http_request_duration_seconds_count{app="{{ include "api-gateway.name" . }}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[2m])) or vector(0)
    - name: tasa-de-error
      initialDelay: 2m
      interval: 1m
      count: 3
      failureLimit: 1
      successCondition: result[0] <= {{ .Values.analisis.maxTasaError }}
      provider:
        prometheus:
          address: {{ .Values.analisis.prometheus }}
          query: |
            (
              (sum(rate(http_request_duration_seconds_count{app="{{ include "api-gateway.name" . }}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}",status_code=~"5.."}[2m])) or vector(0))
              /
              sum(rate(http_request_duration_seconds_count{app="{{ include "api-gateway.name" . }}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[2m]))
            ) or vector(0)
    - name: latencia-p95
      initialDelay: 2m
      interval: 1m
      count: 3
      failureLimit: 1
      successCondition: result[0] <= {{ .Values.analisis.maxLatenciaP95 }}
      provider:
        prometheus:
          address: {{ .Values.analisis.prometheus }}
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{app="{{ include "api-gateway.name" . }}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[2m]))) or vector(0)
    {{- if .Values.analisis.citas }}
    # negocio: GraphQL responde HTTP 200 aunque la operacion falle, asi que se mide el resultado de agendar.
    # Los rechazos (artista ocupado) son reglas del estudio y no cuentan como error.
    - name: citas-con-error
      initialDelay: 2m
      interval: 1m
      count: 3
      failureLimit: 1
      successCondition: result[0] <= {{ .Values.analisis.maxTasaError }}
      provider:
        prometheus:
          address: {{ .Values.analisis.prometheus }}
          query: |
            (
              (sum(rate(citas_intentos_total{app="{{ include "api-gateway.name" . }}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}",resultado="error"}[2m])) or vector(0))
              /
              sum(rate(citas_intentos_total{app="{{ include "api-gateway.name" . }}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}",resultado=~"exitosa|error"}[2m]))
            ) or vector(0)
    {{- end }}
