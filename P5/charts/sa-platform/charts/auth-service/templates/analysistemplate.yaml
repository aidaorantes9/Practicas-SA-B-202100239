apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "auth-service.fullname" . }}-smoke-test
spec:
  metrics:
    - name: smoke-test-health
      count: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              metadata:
                labels:
                  role: smoke-test
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                containers:
                  - name: smoke-test
                    image: curlimages/curl:8.10.1
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 100
                    resources:
                      requests:
                        cpu: 50m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 64Mi
                    command:
                      - sh
                      - -c
                      - |
                        for i in 1 2 3 4 5; do
                          curl -sf http://{{ include "auth-service.fullname" . }}:{{ .Values.service.port }}/health || exit 1
                          sleep 2
                        done
