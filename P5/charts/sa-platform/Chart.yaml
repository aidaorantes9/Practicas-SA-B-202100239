apiVersion: v2
name: sa-platform
description: Plataforma de microservicios del estudio de tatuajes - Practica 5
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "15.5.20"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: rabbitmq
    version: "14.6.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled

  - name: auth-service
    version: "0.1.0"
    repository: "file://charts/auth-service"
    condition: auth-service.enabled

  - name: artists-service
    version: "0.1.0"
    repository: "file://charts/artists-service"
    condition: artists-service.enabled

  - name: appointments-service
    version: "0.1.0"
    repository: "file://charts/appointments-service"
    condition: appointments-service.enabled

  - name: notification-service
    version: "0.1.0"
    repository: "file://charts/notification-service"
    condition: notification-service.enabled

  - name: api-gateway
    version: "0.1.0"
    repository: "file://charts/api-gateway"
    condition: api-gateway.enabled