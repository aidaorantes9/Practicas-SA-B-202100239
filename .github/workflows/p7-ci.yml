name: P7 - CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: sa-practica

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, appointments-service, notification-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: P4/${{ matrix.service }}
        run: npm install

      - name: Ejecutar pruebas
        working-directory: P4/${{ matrix.service }}
        run: npm test

  build-and-test-artists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        working-directory: P4/artists-service
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        working-directory: P4/artists-service
        run: python -m pytest tests/ -v

  docker-build-push:
    needs: [build-and-test, build-and-test-artists]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, appointments-service, notification-service, api-gateway, artists-service]
    steps:
      - uses: actions/checkout@v4

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: P4/${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}

  deploy-kind:
    needs: docker-build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Crear clúster kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: sa-p7-cluster

      - name: Crear secret para descargar imagenes privadas de GHCR
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar dependencias del chart
        working-directory: P5/charts/sa-platform
        run: helm dependency build

      - name: Instalar la plataforma con Helm
        working-directory: P5/charts/sa-platform
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/sa-practica
          TAG=${{ github.sha }}
          helm install sa-p7 . \
            --set postgresql.auth.password=clave-postgres-p7 \
            --set rabbitmq.auth.password=clave-rabbitmq-p7 \
            --set secrets.jwtSecret=jwt-secret-p7 \
            --set secrets.aesSecretKey=12345678901234567890123456789012 \
            --set secrets.hmacSecretKey=hmac-secret-p7 \
            --set auth-service.image.repository=$IMG-auth-service \
            --set auth-service.image.tag=$TAG \
            --set auth-service.image.pullPolicy=Always \
            --set auth-service.imagePullSecrets[0].name=ghcr-pull-secret \
            --set auth-service.autoscaling.enabled=false \
            --set auth-service.replicaCount=1 \
            --set artists-service.image.repository=$IMG-artists-service \
            --set artists-service.image.tag=$TAG \
            --set artists-service.image.pullPolicy=Always \
            --set artists-service.imagePullSecrets[0].name=ghcr-pull-secret \
            --set artists-service.autoscaling.enabled=false \
            --set artists-service.replicaCount=1 \
            --set appointments-service.image.repository=$IMG-appointments-service \
            --set appointments-service.image.tag=$TAG \
            --set appointments-service.image.pullPolicy=Always \
            --set appointments-service.imagePullSecrets[0].name=ghcr-pull-secret \
            --set appointments-service.autoscaling.enabled=false \
            --set appointments-service.replicaCount=1 \
            --set notification-service.image.repository=$IMG-notification-service \
            --set notification-service.image.tag=$TAG \
            --set notification-service.image.pullPolicy=Always \
            --set notification-service.imagePullSecrets[0].name=ghcr-pull-secret \
            --set notification-service.autoscaling.enabled=false \
            --set notification-service.replicaCount=1 \
            --set api-gateway.image.repository=$IMG-api-gateway \
            --set api-gateway.image.tag=$TAG \
            --set api-gateway.image.pullPolicy=Always \
            --set api-gateway.imagePullSecrets[0].name=ghcr-pull-secret \
            --set api-gateway.autoscaling.enabled=false \
            --set api-gateway.replicaCount=1 \
            --wait --timeout 6m

      - name: Mostrar estado de pods (diagnostico)
        if: always()
        run: kubectl get pods -o wide

      - name: Smoke test - api-gateway responde
        run: |
          kubectl port-forward svc/sa-p7-api-gateway 3000:3000 &
          sleep 5
          curl -f http://localhost:3000/health
